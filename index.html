<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TEKOM C 25</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      /* Lapisan Background Gambar dengan Efek Blur */
      .bg-blur {
        position: fixed;
        top: -20px;
        left: -20px;
        width: calc(100vw + 40px);
        height: calc(100vh + 40px);
        background-image: url('TEKOM C25.jpeg');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        /* Anda bisa menyesuaikan tingkat blur di sini (misal: 5px, 10px, 15px) */
        filter: blur(10px);
        -webkit-filter: blur(10px);
        z-index: -2;
      }

      /* Lapisan Overlay Gelap agar teks di atasnya tetap jelas dan kontras */
      .bg-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: rgba(0, 0, 0, 0.5);
        z-index: -1;
      }

      body {
        overflow-x: hidden;
        min-height: 100vh;
      }
    </style>
  </head>
  <body class="text-white">

    <!-- Latar belakang foto blur & overlay -->
    <div class="bg-blur"></div>
    <div class="bg-overlay"></div>

    <!-- Konten halaman -->
    <div class="container d-flex flex-column justify-content-center align-items-center vh-100 text-center">
      <h1 class="display-3 fw-bold mb-3">WELCOME TO OUR CLASS</h1>
      <h2 class="badge bg-primary fs-3 px-4 py-2 mb-4">TEKOM C 25</h2>
      <p class="lead mb-4">Selamat datang di kelas kami!</p>
      <a href="members.html" class="btn btn-primary btn-lg px-4 py-2 rounded-pill shadow-lg">
        Lihat Anggota Kelas &rarr;
      </a>
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
